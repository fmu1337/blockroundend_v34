name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash tools/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noroundend
          path: dist/noroundend-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/noroundend-*.zip
          generate_release_notes: true
          body: |
            CS:S v34 — No Round End (SM 1.4+)
